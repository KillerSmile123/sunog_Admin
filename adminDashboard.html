<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
   <link rel="stylesheet" href="css/adminDashboard.css" />
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>FireTrackr</h2>
    </div>
    <div class="nav">
      <a href="adminDashboard.html"><i class="fas fa-home"></i> Dashboard</a>
      <a href="alerts.html"><i class="fas fa-bell"></i> Alerts <span class="badge">0</span></a>
      <a href="alertResolve.html"><i class="fas fa-fire"></i> History</a>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <h1>Dashboard</h1>
      <div class="profile">
        <button class="toggle-btn" id="toggleTheme">🌙</button>
        <a href="adminProfile.html"><i class="fas fa-user-circle"></i></a>
      </div>
    </div>
    <div class="content">
      <div class="stats">
        <div class="stat-card">
          <h3 id="activeCount">0</h3>
          <p>Active Alerts</p>
        </div>
        <div class="stat-card">
          <h3 id="totalCount">0</h3>
          <p>Total Reports</p>
        </div>
        <div class="stat-card">
          <h3 id="resolvedCount">0</h3>
          <p>Resolved</p>
        </div>
      </div>
      <div class="table-container">
        <h2>Recent Alerts</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Description</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="recentAlertsTable">
            <!-- JS will fill this -->
          </tbody>
        </table>
        <a href="alerts.html" class="view-more">View More Alerts</a>
      </div>
      <div id="map"></div>
    </div>
    <div class="footer">
      &copy; 2025 FireTrackr. All rights reserved.
    </div>
  </div>

 
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/adminDashboard.js"></script>
  

</body>
</html>
