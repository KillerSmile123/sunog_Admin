<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/adminProfile.css" />
</head>
<body>
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="left">
      <button class="back-btn" onclick="goBack()">← Back</button>
      <h1>Admin Profile</h1>
    </div>
  </div>

  <!-- Profile Card -->
  <div class="profile-card">
    <img src="https://via.placeholder.com/120" alt="Admin Picture" id="profile-pic">
    <h2 id="admin-name">Admin Name</h2>
    <p class="role">System Administrator</p>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept="image/*">
    <button id="upload-btn" type="button">Change Picture</button>

    <form id="profileForm">
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" value="John Doe">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" value="admin@example.com">
      </div>

      <div class="form-group">
        <label for="contact">Contact Number</label>
        <input type="text" id="contact" value="+63 912 345 6789">
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <input type="text" id="role" value="Administrator" disabled>
      </div>

      <button type="submit">Save Changes</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("profileForm");
    const uploadBtn = document.getElementById("upload-btn");
    const fileInput = document.getElementById("fileInput");
    const profilePic = document.getElementById("profile-pic");

    // Save profile details
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      alert("Profile updated successfully!");
    });

    // Open file input when button clicked
    uploadBtn.addEventListener("click", () => {
      fileInput.click();
    });

    // When new picture is chosen
    fileInput.addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          profilePic.src = e.target.result; // change profile picture
          localStorage.setItem("adminProfilePic", e.target.result); // save in local storage
        };
        reader.readAsDataURL(file);
      }
    });

    // Load saved picture if exists
    window.addEventListener("DOMContentLoaded", () => {
      const savedPic = localStorage.getItem("adminProfilePic");
      if (savedPic) {
        profilePic.src = savedPic;
      }
    });

    // Go back function
    function goBack() {
      window.history.back();
    }
  </script>
</body>
</html>
