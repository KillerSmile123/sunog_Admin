<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #e8ecef;
      min-height: 100vh;
    }

    .top-bar {
      background-color: #3d4f5d;
      padding: 1rem 2rem;
      color: white;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      padding: 0.5rem;
    }

    .back-btn:hover {
      opacity: 0.8;
    }

    .top-bar h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .profile-card {
      max-width: 500px;
      margin: 2rem auto;
      background: white;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    #profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
      border: 3px solid #4db8a8;
    }

    #admin-name {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #2c3e50;
    }

    .role {
      color: #6c757d;
      margin-bottom: 1.5rem;
    }

    #fileInput {
      display: none;
    }

    #upload-btn {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 0.6rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      transition: background-color 0.3s;
    }

    #upload-btn:hover {
      background-color: #2980b9;
    }

    #upload-btn:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #2c3e50;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
      font-family: 'Roboto', sans-serif;
    }

    .form-group input:disabled {
      background-color: #f5f5f5;
      cursor: not-allowed;
    }

    .form-group input:focus {
      outline: none;
      border-color: #4db8a8;
    }

    button[type="submit"] {
      background-color: #4db8a8;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
      transition: background-color 0.3s;
    }

    button[type="submit"]:hover {
      background-color: #3d9984;
    }

    button[type="submit"]:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }

    .error-message {
      background-color: #f8d7da;
      color: #721c24;
      padding: 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      text-align: center;
    }

    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      text-align: center;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #4db8a8;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <div class="top-bar">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <h1>Admin Profile</h1>
  </div>

  <!-- Profile Card -->
  <div class="profile-card">
    <div id="messageContainer"></div>
    <div id="loadingContainer"></div>
    
    <img src="https://via.placeholder.com/120" alt="Admin Picture" id="profile-pic">
    <h2 id="admin-name">Admin Name</h2>
    <p class="role">System Administrator</p>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept="image/*">
    <button id="upload-btn" type="button">Change Picture</button>

    <form id="profileForm">
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-group">
        <label for="contact">Contact Number</label>
        <input type="text" id="contact" required>
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <input type="text" id="role" value="Administrator" disabled>
      </div>

      <button type="submit">Save Changes</button>
    </form>
  </div>

  <script src="js/adminProf.js"></script>
</body>
</html>
