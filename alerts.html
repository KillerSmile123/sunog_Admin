<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Active Alerts - FireTrackr</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/alerts.css" />
  <link rel="stylesheet" href="css/alertsModals.css" />
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <img src="images/FireTrackrAdmin.png" alt="FireTrackr" class="logo-image" />
    </div>
    <div class="nav">
      <a href="adminDashboard.html"><i class="fas fa-home"></i> Dashboard</a>
      <a href="alerts.html" class="active"><i class="fas fa-bell"></i> Alerts <span class="badge" id="alerts-badge">0</span></a>
      <a href="alertResolve.html"><i class="fas fa-check-circle"></i> Resolved <span class="badge" id="resolved-badge">0</span></a>
      <a href="spam.html"><i class="fas fa-ban"></i> Spam <span class="badge" id="spam-badge">0</span></a>
    </div>
    <div class="sidebar-footer">
      <a href="adminProfile.html"><i class="fas fa-user-circle"></i> Profile</a>
      <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h1><i class="fas fa-bell"></i> Active Alerts</h1>
        <p class="subtitle">Monitor and respond to fire incidents</p>
      </div>
      <a href="adminProfile.html" class="profile-link">
        <i class="fas fa-user-circle profile-icon"></i>
      </a>
    </div>

    <div class="content">
      <div id="alerts-container">
        <div class="info" style="text-align: center; padding: 20px;">
          <i class="fas fa-spinner fa-spin"></i> Loading alerts...
        </div>
      </div>
    </div>

    <div class="footer">
      &copy; 2025 FireTrackr. All rights reserved.
    </div>
  </div>

  <!-- Respond Modal -->
  <div class="modal" id="respond-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fas fa-reply"></i> Respond to Alert</h3>
        <button type="button" class="modal-close" onclick="closeRespondModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <p id="respond-alert-info"></p>
        <label for="response-message"><strong>Your Response:</strong></label>
        <textarea id="response-message" rows="4" placeholder="Enter your response message to the reporter..."></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-cancel" onclick="closeRespondModal()">Cancel</button>
        <button type="button" class="btn-primary" onclick="sendResponse()">
          <i class="fas fa-paper-plane"></i> Send Response
        </button>
      </div>
    </div>
  </div>

  <!-- Resolve Modal -->
  <div class="modal" id="resolve-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fas fa-check-circle"></i> Resolve Fire Alert</h3>
        <button type="button" class="modal-close" onclick="closeResolveModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <p id="resolve-alert-info"></p>
        <label for="resolve-time"><strong>Time Fire Was Resolved:</strong></label>
        <input type="time" id="resolve-time" required>
        <small style="display:block;margin-top:5px;color:#666;">
          Enter the time when the fire was extinguished
        </small>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-cancel" onclick="closeResolveModal()">Cancel</button>
        <button type="button" class="btn-success" onclick="markAsResolved()">
          <i class="fas fa-check"></i> Mark as Resolved
        </button>
      </div>
    </div>
  </div>

  <!-- Load Leaflet first -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Load config.js FIRST to define API_BASE -->
  <script src="js/config.js"></script>
  <script src="js/Sidebarbadges.js"></script>
  
  <!-- Then load auth utilities -->
  <script src="js/auth.js"></script>
  
  <!-- Finally load alertsView.js (which uses API_BASE from config.js) -->
  <script src="js/alertsView.js"></script>

  <script>
    // Logout function
    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        document.cookie.split(";").forEach((c) => {
          document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
        });
        window.location.href = 'adminLogin.html';
      }
    }
  </script>
</body>
</html>
