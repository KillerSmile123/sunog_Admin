<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNOG Admin</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Splash Overlay */
        .splash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut 0.5s ease 2.5s forwards;
        }

        .splash-content {
            text-align: center;
            color: #fff;
            animation: scaleIn 0.6s ease forwards;
        }

        .splash-content img {
            width: 180px;
            height: 180px;
            margin-bottom: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 50%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            animation: pulse 2s ease infinite;
        }

        .splash-content h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .splash-content p {
            font-size: 1.1rem;
            opacity: 0.95;
            margin-bottom: 30px;
        }

        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .loading-dots span {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            animation: bounce 1.4s ease infinite;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Animations */
        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-12px);
            }
        }
    </style>
</head>
<body>

    <!-- Splash Overlay -->
    <div class="splash-overlay">
        <div class="splash-content">
            <img src="images/FireTrackrAdmin.png" alt="SUNOG Logo">
            <h1>Admin Panel</h1>
            <p>Authorized personnel only</p>
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>

    <script>
        // Redirect to adminLogin.html after splash
        setTimeout(function() {
            window.location.href = 'adminLogin.html';
        }, 3000); // 3 seconds
    </script>

</body>
</html>
